  <path d="M72 50 L60 44 L60 56 Z" fill="#1a1a2e"/>
  <path d="M35 35 L42 40 L38 48 L28 45 L30 35 Z" fill="#1a1a2e"/>
  <path d="M65 35 L58 40 L62 48 L72 45 L70 35 Z" fill="#1a1a2e"/>
  <path d="M35 65 L42 60 L38 52 L28 55 L30 65 Z" fill="#1a1a2e"/>
  <path d="M65 65 L58 60 L62 52 L72 55 L70 65 Z" fill="#1a1a2e"/>
